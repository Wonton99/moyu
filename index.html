<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="摸鱼小游戏合集 — 死灵召唤师、数独增量、宿舍夜班，即点即玩。" />
  <meta property="og:title" content="摸鱼 · 小游戏合集" />
  <meta property="og:description" content="死灵召唤师 · 数独增量 · 宿舍夜班 — 浏览器里开箱即玩" />
  <meta property="og:type" content="website" />
  <title>摸鱼 · 小游戏合集</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">摸</span>
      <span class="brand-name">摸鱼</span>
    </a>
    <div class="top-stats">
      <span class="online">3 款游戏</span>
      <span class="visit-chip" id="visitToday" data-source="local">统计中…</span>
    </div>
  </header>

  <main>
    <section class="intro">
      <h1>小游戏合集</h1>
      <p>点开即玩，进度存在本机。</p>
    </section>

    <section class="games" aria-label="游戏列表">
      <article class="game-card" data-accent="rose">
        <a class="card-link" href="games/necromancer/" aria-label="开始游玩 死灵召唤师"></a>
        <div class="card-art art-necro" aria-hidden="true">
          <svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg">
            <rect width="480" height="270" fill="#F3E8F0"/>
            <circle cx="360" cy="70" r="48" fill="#FF4D8D" opacity="0.12"/>
            <circle cx="100" cy="210" r="56" fill="#3DE7C7" opacity="0.1"/>
            <ellipse cx="240" cy="118" rx="42" ry="48" fill="#FFFFFF" stroke="#FF4D8D" stroke-width="1.5"/>
            <circle cx="224" cy="112" r="8" fill="#1A1D23"/>
            <circle cx="256" cy="112" r="8" fill="#1A1D23"/>
            <path d="M228 138h24" stroke="#1A1D23" stroke-width="3" stroke-linecap="round"/>
            <path d="M232 146v10M240 146v12M248 146v10" stroke="#1A1D23" stroke-width="2"/>
            <rect x="90" y="170" width="28" height="36" rx="4" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.2"/>
            <rect x="130" y="182" width="22" height="28" rx="3" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.2" opacity="0.75"/>
            <rect x="340" y="176" width="26" height="34" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
            <rect x="378" y="186" width="20" height="26" rx="3" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2" opacity="0.75"/>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-top">
            <h2>死灵召唤师</h2>
            <span class="ver">v0.5.9</span>
          </div>
          <p>动作 Roguelike · 召唤亡灵清层</p>
          <span class="play">开始游戏 →</span>
        </div>
      </article>

      <article class="game-card" data-accent="amber">
        <a class="card-link" href="games/dorm-night/" aria-label="开始游玩 宿舍夜班"></a>
        <div class="card-art art-dorm" aria-hidden="true">
          <svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg">
            <rect width="480" height="270" fill="#141B24"/>
            <rect x="0" y="0" width="480" height="270" fill="url(#gD)"/>
            <defs>
              <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1a2834"/>
                <stop offset="100%" stop-color="#0b0e14"/>
              </linearGradient>
            </defs>
            <!-- pixel corridor -->
            <rect x="40" y="60" width="400" height="150" fill="#121820" stroke="#2a3a4c" stroke-width="2"/>
            <rect x="40" y="200" width="400" height="10" fill="#0a0d12"/>
            <!-- doors -->
            <rect x="70" y="90" width="50" height="80" fill="#0e141c" stroke="#3dff9a" stroke-width="2"/>
            <rect x="150" y="90" width="50" height="80" fill="#0e141c" stroke="#f0c14b" stroke-width="2"/>
            <rect x="230" y="90" width="50" height="80" fill="#0e141c" stroke="#6ecbff" stroke-width="2"/>
            <rect x="310" y="90" width="50" height="80" fill="#0e141c" stroke="#b894ff" stroke-width="2"/>
            <!-- bed -->
            <rect x="380" y="140" width="40" height="40" fill="#182028" stroke="#3dff9a" stroke-width="1.5"/>
            <rect x="386" y="150" width="28" height="12" fill="#1a8f55"/>
            <!-- turret -->
            <rect x="120" y="70" width="14" height="18" fill="#ffb347"/>
            <rect x="124" y="58" width="6" height="14" fill="#f0c14b"/>
            <!-- scanlines hint -->
            <text x="24" y="40" fill="#3dff9a" font-size="12" font-family="Consolas, monospace" opacity="0.75">PIXEL NIGHT</text>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-top">
            <h2>宿舍夜班</h2>
            <span class="ver">PIXEL</span>
          </div>
          <p>像素塔防 · 躺床攒钱，造炮守门</p>
          <span class="play">开始游戏 →</span>
        </div>
      </article>

      <article class="game-card">
        <a class="card-link" href="games/sudoku/" aria-label="开始游玩 数独增量"></a>
        <div class="card-art art-sudoku" aria-hidden="true">
          <svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg">
            <rect width="480" height="270" fill="#E8F6F3"/>
            <circle cx="90" cy="60" r="44" fill="#14B8A6" opacity="0.1"/>
            <g transform="translate(150,40)" stroke="#0F766E" fill="none">
              <rect width="180" height="180" stroke-width="1.5" opacity="0.7"/>
              <path d="M60 0v180M120 0v180M0 60h180M0 120h180" stroke-width="1.2" opacity="0.55"/>
              <path d="M20 0v180M40 0v180M80 0v180M100 0v180M140 0v180M160 0v180M0 20h180M0 40h180M0 80h180M0 100h180M0 140h180M0 160h180" stroke-width="0.6" opacity="0.25"/>
              <text x="30" y="38" text-anchor="middle" fill="#0F766E" font-size="22" font-family="Consolas, monospace">7</text>
              <text x="90" y="38" text-anchor="middle" fill="#1A1D23" font-size="22" font-family="Consolas, monospace" opacity="0.55">2</text>
              <text x="150" y="98" text-anchor="middle" fill="#0F766E" font-size="22" font-family="Consolas, monospace">5</text>
              <text x="30" y="158" text-anchor="middle" fill="#1A1D23" font-size="22" font-family="Consolas, monospace" opacity="0.55">1</text>
              <text x="90" y="158" text-anchor="middle" fill="#0F766E" font-size="22" font-family="Consolas, monospace">9</text>
            </g>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-top">
            <h2>数独增量</h2>
            <span class="ver">v0.9.0</span>
          </div>
          <p>休闲增量 · 解盘赚能量，挂机变强</p>
          <span class="play">开始游戏 →</span>
        </div>
      </article>
    </section>
  </main>

  <footer class="footer">
    <span>摸鱼</span>

    <span id="visitLocalTotal" class="visit-foot" data-source="local">累计访问 …</span>
  </footer>
  <!-- busuanzi 需要容器在 DOM 中存在（数值由脚本填入，再由 visit.js 读取） -->
  <div class="busuanzi-anchor" aria-hidden="true">
    <span id="busuanzi_container_site_pv">本站PV:<span id="busuanzi_value_site_pv"></span></span>
    <span id="busuanzi_container_site_uv">本站UV:<span id="busuanzi_value_site_uv"></span></span>
  </div>
  <script src="js/visit.js?v=pv3" defer></script>
</body>
</html>
